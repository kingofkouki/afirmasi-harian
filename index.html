<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>30 Hari Afirmasi Diri</title>

<!-- Pengaturan PWA & Full Screen iOS/Android -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">

<!-- Meta tag untuk warna status bar dinamis -->
<meta name="theme-color" id="metaThemeColor" content="#000000">

<!-- Mengaktifkan mode layar penuh di iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- Mengimpor Google Fonts untuk Tulisan Tangan -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Dancing+Script:wght@400..700&family=Indie+Flower&family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">

<style>
  /* Palet Warna Khas iOS */
  :root[data-theme="light"] { 
    color-scheme: light; 
    --bg: #f2f2f7;         
    --card: #ffffff;       
    --ink: #000000;        
    --muted: #8e8e93;      
    --accent: #34c759;     
    --line: #e5e5ea;       
    --soft: #e5f9e7;       
    --button: #f2f2f7;     
    --shadow: 0 8px 30px rgba(0,0,0,0.04); 
  }
  :root { 
    color-scheme: dark; 
    --bg: #000000;         
    --card: #1c1c1e;       
    --ink: #ffffff;        
    --muted: #8e8e93;      
    --accent: #30d158;     
    --line: #38383a;       
    --soft: #243424;       
    --button: #2c2c2e;     
    --shadow: 0 8px 30px rgba(0,0,0,0.2); 
  }
  
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  body, .card, .btn, section { transition: background-color 0.3s ease, color 0.3s ease; }
  
  body { 
    margin: 0; 
    background: var(--bg); 
    color: var(--ink); 
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  
  /* Area wrapper ditambahkan env(safe-area-inset-bottom) */
  .wrap { 
    max-width: 600px; 
    margin: 0 auto; 
    padding: 0 16px calc(48px + env(safe-area-inset-bottom)); 
  }
  
  /* Topbar ditambahkan env(safe-area-inset-top) agar aman dari poni */
  .topbar { 
    display: flex; justify-content: flex-end; 
    padding-top: calc(20px + env(safe-area-inset-top));
    margin-bottom: 16px; 
  }
  .theme-toggle { 
    display: inline-flex; align-items: center; gap: 6px; 
    background: var(--button); color: var(--ink); 
    border: none; border-radius: 20px; padding: 8px 14px; 
    cursor: pointer; font: inherit; font-size: 0.9rem; font-weight: 600; 
  }
  
  header { text-align: center; padding: 10px 0 24px; }
  h1 { font-size: clamp(1.8rem, 5vw, 2.2rem); font-weight: 700; letter-spacing: -0.5px; margin: 0 0 8px; }
  .sub { color: var(--muted); font-size: 0.95rem; margin: 0; }
  
  .card { 
    background: var(--card); 
    border-radius: 24px; 
    padding: 24px; 
    box-shadow: var(--shadow); 
  }
  
  .progress-row { display: flex; justify-content: space-between; font-size: 0.9rem; font-weight: 600; margin-bottom: 8px; color: var(--muted); }
  
  progress { 
    width: 100%; height: 6px; border-radius: 10px; border: none; background: var(--line); overflow: hidden;
  }
  progress::-webkit-progress-bar { background-color: var(--line); }
  progress::-webkit-progress-value { background-color: var(--accent); border-radius: 10px; transition: width 0.4s ease; }
  progress::-moz-progress-bar { background-color: var(--accent); border-radius: 10px; }
  
  .days { 
    display: flex; gap: 12px; margin: 24px 0; padding: 4px 2px 12px; 
    overflow-x: auto; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; 
    scrollbar-width: none; 
  }
  .days::-webkit-scrollbar { display: none; }
  
  .day { 
    flex: 0 0 44px; width: 44px; height: 44px; scroll-snap-align: start; 
    border: none; background: transparent; border-radius: 50%; 
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font: inherit; font-size: 1rem; font-weight: 500; color: var(--ink);
    transition: transform 0.2s, background-color 0.2s;
  }
  .day:active { transform: scale(0.9); }
  .day.active { background: var(--accent); color: #ffffff; font-weight: 700; box-shadow: 0 4px 10px rgba(52, 199, 89, 0.3); }
  .day.done:not(.active) { background: var(--soft); color: var(--accent); font-weight: 600; }
  
  .flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
  .eyebrow { color: var(--accent); letter-spacing: 1px; font-weight: 700; font-size: 0.8rem; text-transform: uppercase; }
  
  .font-controls { display: flex; align-items: center; gap: 8px; }
  .font-controls select { 
    padding: 6px 12px; border-radius: 10px; background: var(--button); color: var(--ink); 
    border: none; font-family: inherit; font-size: 0.85rem; font-weight: 500; outline: none; cursor: pointer;
    appearance: none; -webkit-appearance: none;
  }
  
  h2 { margin: 0 0 4px; font-size: 1.5rem; font-weight: 700; letter-spacing: -0.5px; }
  h3.en-text { font-size: 1.1rem; font-weight: 400; margin: 0 0 16px; opacity: 0.8; }
  .en-text { color: var(--muted); }
  
  #affirmation, #affirmationEn { white-space: pre-line; transition: font-size 0.3s, font-family 0.3s; }
  #affirmationEn { margin-top: 12px; margin-bottom: 20px; padding-top: 16px; border-top: 1px solid var(--line); }
  #actionEn { display: block; margin-top: 4px; font-size: 0.95rem; }

  .font-default { font-size: 1.15rem; line-height: 1.5; }
  .font-caveat { font-family: 'Caveat', cursive; font-size: 1.8rem; line-height: 1.3; }
  .font-dancing { font-family: 'Dancing Script', cursive; font-size: 1.7rem; line-height: 1.3; }
  .font-kalam { font-family: 'Kalam', cursive; font-size: 1.4rem; }
  .font-indie { font-family: 'Indie Flower', cursive; font-size: 1.4rem; }

  .actions { display: flex; flex-direction: column; gap: 12px; margin-top: 24px; }
  .actions-row { display: flex; gap: 10px; }
  .actions-row .btn { flex: 1; justify-content: center; }
  
  .btn { 
    border: none; border-radius: 14px; padding: 14px 16px; 
    cursor: pointer; font: inherit; font-size: 1rem; font-weight: 600; 
    background: var(--button); color: var(--accent); 
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn:active { opacity: 0.7; }
  .btn.primary { background: var(--accent); color: #ffffff; font-size: 1.05rem; padding: 16px; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  
  .nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 24px; }
  .nav .btn { flex: 1; background: transparent; color: var(--muted); font-weight: 500; }
  
  .daily-action { margin-top: 24px; padding: 18px; background: var(--button); border-radius: 16px; }
  .daily-action strong { display: block; margin-bottom: 4px; font-size: 0.95rem; }
  #action { font-weight: 500; }
  
  footer { text-align: center; color: var(--muted); font-size: 0.85rem; margin-top: 32px; line-height: 1.6; }
  .creator-text { font-weight: 600; color: var(--ink); margin-top: 8px; display: block; opacity: 0.7; }
</style>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <button class="theme-toggle" id="themeBtn" type="button">
      <span id="themeIcon">☀️</span><span id="themeLabel">Light</span>
    </button>
  </div>
  
  <header>
    <h1>Afirmasi Diri</h1>
    <p class="sub">30 Hari Membangun Kebiasaan Positif</p>
  </header>
  
  <main class="card">
    <div class="progress-row">
      <span id="progressText">0 dari 30 selesai</span>
      <span id="progressPercent">0%</span>
    </div>
    <progress id="progress" max="30" value="0"></progress>
    
    <div class="days" id="days"></div>
    
    <section aria-live="polite">
      <div class="flex-between">
        <div class="eyebrow" id="dayLabel">HARI 01</div>
        <div class="font-controls">
          <select id="fontSelect">
            <option value="font-default">Sistem</option>
            <option value="font-caveat">Caveat</option>
            <option value="font-dancing">Dancing</option>
            <option value="font-kalam">Kalam</option>
            <option value="font-indie">Indie</option>
          </select>
        </div>
      </div>
      
      <h2 id="title"></h2>
      <h3 id="titleEn" class="en-text"></h3>
      
      <div id="affirmation" class="font-default"></div>
      <div id="affirmationEn" class="en-text font-default"></div>
      
      <div class="daily-action">
        <strong>Tindakan nyata <span class="en-text" style="font-weight:normal">(Action)</span></strong>
        <span id="action"></span>
        <span id="actionEn" class="en-text"></span>
      </div>
    </section>
    
    <div class="actions">
      <button class="btn primary" id="markBtn">Tandai Selesai</button>
      <div class="actions-row">
        <button class="btn" id="copyBtn">Salin Teks</button>
        <button class="btn" id="printBtn">Cetak PDF</button>
      </div>
    </div>
    
    <div class="nav">
      <button class="btn" id="prevBtn">← Sebelumnya</button>
      <button class="btn" id="nextBtn">Berikutnya →</button>
    </div>
  </main>
  
  <footer>
    Lakukan satu tindakan nyata setiap hari
    <span class="creator-text">Created by Cangkir Story</span>
  </footer>
</div>

<script>
   const affirmations = [
  ["Saya membuka pintu kelimpahan", "Hari ini, saya membuka hati dan pikiran untuk menerima rezeki dari segala penjuru. Alam semesta penuh dengan kelimpahan yang siap mengalir ke dalam hidup saya.", "Rapikan dompet atau ruang kerja Anda hari ini agar energi positif mudah masuk.", "I open the doors of abundance", "Today, I open my heart and mind to receive sustenance from all directions. The universe is full of abundance ready to flow into my life.", "Organize your wallet or workspace today so positive energy can easily enter."],
  ["Saya pantas sejahtera", "Saya melepaskan semua keraguan. Saya berhak sukses, bahagia, dan sejahtera. Keinginan saya untuk sejahtera adalah hal yang baik dan membawa manfaat.", "Tuliskan 3 alasan mengapa Anda pantas mendapatkan rezeki yang baik.", "I deserve to be prosperous", "I release all doubts. I deserve to be successful, happy, and prosperous. My desire to prosper is a good thing and brings benefits.", "Write down 3 reasons why you deserve good fortune."],
  ["Rezeki datang dari arah tak disangka", "Saya percaya bahwa rezeki tidak hanya datang dari gaji atau usaha saya saat ini. Tuhan bisa mendatangkan rezeki dari jalan yang tidak pernah saya duga.", "Tersenyum dan sapalah orang baru hari ini, rezeki sering datang melalui perantara manusia.", "Sustenance comes from unexpected ways", "I believe that sustenance doesn't only come from my salary or current efforts. God can bring fortune from paths I never expected.", "Smile and greet a new person today, fortune often comes through human intermediaries."],
  ["Uang adalah alat kebaikan", "Uang adalah alat yang netral. Di tangan saya, uang akan menjadi jalan untuk merawat keluarga, bersedekah, dan menebar banyak kebaikan.", "Niatkan sebagian penghasilan Anda berikutnya untuk membantu orang lain.", "Money is a tool for goodness", "Money is a neutral tool. In my hands, money will be a way to care for family, give to charity, and spread much goodness.", "Intend a portion of your next income to help others."],
  ["Bersyukur melipatgandakan nikmat", "Semakin saya bersyukur atas apa yang saya miliki saat ini, semakin banyak nikmat yang akan ditambahkan ke dalam hidup saya. Keluhan hanya menjauhkan rezeki.", "Ucapkan syukur dengan suara pelan atas 3 hal kecil yang Anda rasakan pagi ini.", "Gratitude multiplies blessings", "The more grateful I am for what I have now, the more blessings will be added to my life. Complaints only drive fortune away.", "Express gratitude softly for 3 small things you feel this morning."],
  ["Saya magnet peluang", "Pikiran saya jernih dan mata saya tajam melihat peluang. Di mana orang lain melihat masalah, saya melihat kesempatan untuk memberikan solusi dan rezeki.", "Catat satu ide sederhana yang bisa menghasilkan uang tambahan.", "I am a magnet for opportunities", "My mind is clear and my eyes are sharp to spot opportunities. Where others see problems, I see chances to provide solutions and fortune.", "Note down one simple idea that could generate extra income."],
  ["Semakin banyak memberi, semakin banyak menerima", "Saya tidak takut miskin karena berbagi. Berbagi waktu, tenaga, ilmu, atau harta akan membuka keran rezeki saya lebih deras lagi.", "Bantu seseorang hari ini tanpa mengharapkan imbalan apa pun.", "The more I give, the more I receive", "I am not afraid of being poor by sharing. Sharing time, energy, knowledge, or wealth will open my tap of fortune even wider.", "Help someone today without expecting anything in return."],
  ["Saya bekerja dengan ikhlas dan cerdas", "Kerja keras saya tidak akan sia-sia. Saya bekerja bukan sekadar menggugurkan kewajiban, tetapi untuk memberikan nilai terbaik yang akan mendatangkan hasil maksimal.", "Lakukan satu tugas hari ini dengan usaha 100% tanpa menunda.", "I work sincerely and smartly", "My hard work will not be in vain. I work not just to fulfill obligations, but to provide the best value that will bring maximum results.", "Do one task today with 100% effort without procrastinating."],
  ["Kegagalan adalah persiapan sukses", "Setiap penolakan atau kerugian finansial di masa lalu adalah pelajaran berharga. Saya menggunakannya sebagai pijakan untuk melompat lebih tinggi.", "Evaluasi satu kesalahan masa lalu dan temukan pelajaran positifnya.", "Failure is preparation for success", "Every rejection or financial loss in the past is a valuable lesson. I use it as a stepping stone to jump higher.", "Evaluate one past mistake and find its positive lesson."],
  ["Saya berdamai dengan uang", "Saya memaafkan kesalahan finansial saya di masa lalu. Saya melepaskan rasa cemas dan mulai berteman dengan uang melalui pengelolaan yang bijaksana.", "Tinjau kembali pengeluaran Anda kemarin dan pastikan tidak ada pemborosan.", "I am at peace with money", "I forgive my past financial mistakes. I release anxiety and start befriending money through wise management.", "Review your expenses yesterday and ensure there is no waste."],
  ["Nilai mendatangkan rezeki", "Uang adalah akibat, bukan sebab. Jika saya fokus memberikan manfaat dan membantu banyak orang, uang akan otomatis mengikuti saya.", "Berikan nilai lebih atau layanan ekstra pada pekerjaan Anda hari ini.", "Value brings fortune", "Money is the effect, not the cause. If I focus on providing benefits and helping many people, money will automatically follow me.", "Provide extra value or service to your work today."],
  ["Kesehatan adalah rezeki utama", "Tubuh yang bugar dan pikiran yang waras adalah aset terbesar saya. Dengan sehat, saya bisa berikhtiar mencari rezeki tanpa halangan.", "Minum segelas air putih dan regangkan tubuh Anda selama 5 menit.", "Health is the ultimate wealth", "A fit body and a sane mind are my greatest assets. By being healthy, I can strive to seek fortune without hindrance.", "Drink a glass of water and stretch your body for 5 minutes."],
  ["Saya mengelola keuangan dengan bijak", "Saya menghargai setiap nominal yang masuk. Saya mampu menahan keinginan impulsif dan fokus pada kebutuhan serta investasi masa depan.", "Tahan diri Anda dari satu pembelian yang sebenarnya tidak terlalu dibutuhkan hari ini.", "I manage finances wisely", "I value every amount that comes in. I am able to resist impulsive desires and focus on needs and future investments.", "Restrain yourself from one purchase you don't really need today."],
  ["Rezeki saya tidak tertukar", "Saya melepaskan rasa iri. Apa yang menjadi milik saya tidak akan lari kepada orang lain, dan apa yang bukan milik saya tidak akan membebani saya.", "Berhenti membandingkan kondisi finansial Anda dengan orang lain di media sosial.", "My sustenance will not be exchanged", "I release envy. What is mine will not run to others, and what is not mine will not burden me.", "Stop comparing your financial condition with others on social media."],
  ["Saya dikelilingi energi kelimpahan", "Saya memilih untuk bergaul dengan pikiran, buku, dan lingkungan yang mendukung kesuksesan. Energi positif menarik hasil yang positif.", "Baca satu artikel atau tonton satu video tentang kebiasaan orang sukses.", "I am surrounded by abundance energy", "I choose to associate with thoughts, books, and environments that support success. Positive energy attracts positive results.", "Read one article or watch one video about the habits of successful people."],
  ["Saya selalu punya lebih dari cukup", "Pikiran saya beralih dari 'kekurangan' menjadi 'berkecukupan'. Saya percaya alam semesta selalu menyediakan apa yang benar-benar saya butuhkan tepat pada waktunya.", "Rapikan barang bekas di rumah dan sumbangkan atau buang agar lega.", "I always have more than enough", "My mind shifts from 'scarcity' to 'sufficiency'. I believe the universe always provides what I truly need right on time.", "Declutter unused items at home and donate or discard them for relief."],
  ["Kejujuran adalah magnet rezeki", "Saya membangun kekayaan di atas fondasi kejujuran dan integritas. Rezeki yang bersih akan membawa ketenangan batin bagi saya dan keluarga.", "Pastikan setiap perkataan dan keputusan Anda hari ini didasari kejujuran.", "Honesty is a magnet for fortune", "I build wealth on the foundation of honesty and integrity. Clean sustenance will bring inner peace for me and my family.", "Ensure every word and decision today is based on honesty."],
  ["Saya merayakan kesuksesan orang lain", "Melihat orang lain kaya atau sukses adalah bukti bahwa kesuksesan itu nyata. Saya ikut senang, karena giliran saya pasti akan tiba.", "Beri ucapan selamat atau doakan kebaikan bagi teman yang sedang sukses.", "I celebrate others' success", "Seeing others wealthy or successful is proof that success is real. I am happy for them, because my turn will surely come.", "Congratulate or pray for a friend who is experiencing success."],
  ["Pikiran saya menciptakan kekayaan", "Kekayaan dimulai dari pikiran. Saya menolak kalimat 'saya tidak mampu' dan menggantinya dengan 'bagaimana caranya saya bisa mampu?'.", "Ubah satu keluhan finansial hari ini menjadi pertanyaan tentang solusi.", "My mind creates wealth", "Wealth starts in the mind. I reject the phrase 'I can't afford it' and replace it with 'how can I afford it?'.", "Turn one financial complaint today into a question about a solution."],
  ["Saya bersabar dalam proses", "Rezeki ibarat menanam pohon. Saya harus rajin menyiramnya dengan usaha dan memupuknya dengan doa, lalu bersabar menunggu masa panen.", "Lanjutkan satu pekerjaan rutin Anda dengan perasaan tenang tanpa terburu-buru.", "I am patient in the process", "Sustenance is like planting a tree. I must diligently water it with effort and fertilize it with prayer, then patiently wait for harvest.", "Continue one of your routine tasks calmly without rushing."],
  ["Ketenangan hati menarik rezeki", "Kecemasan dan kepanikan hanya akan menghalangi ide cemerlang. Saya memilih untuk tenang, karena di dalam ketenangan terdapat solusi yang menghasilkan rezeki.", "Luangkan waktu 5 menit untuk duduk diam dan bernapas perlahan.", "Peace of mind attracts sustenance", "Anxiety and panic will only block brilliant ideas. I choose to be calm, because in calmness lies solutions that generate fortune.", "Take 5 minutes to sit still and breathe slowly."],
  ["Saya berani bertindak", "Rezeki menyukai kecepatan dan keberanian. Saya tidak akan membiarkan keraguan menghentikan langkah saya untuk mengambil peluang baik hari ini.", "Ambil satu tindakan kecil yang membuat Anda sedikit keluar dari zona nyaman.", "I dare to take action", "Fortune loves speed and courage. I will not let doubt stop me from taking good opportunities today.", "Take one small action that slightly pushes you out of your comfort zone."],
  ["Keluarga yang damai adalah sumber rezeki", "Kerukunan di dalam rumah tangga dan keluarga adalah fondasi turunnya keberkahan. Saya membawa kedamaian bagi orang terdekat saya.", "Berikan pelukan, senyuman, atau kata-kata manis untuk anggota keluarga Anda.", "A peaceful family is a source of fortune", "Harmony within the household and family is the foundation for blessings to descend. I bring peace to my loved ones.", "Give a hug, a smile, or sweet words to your family members."],
  ["Saya pantang menyerah", "Ketika satu pintu rezeki tertutup, saya yakin Tuhan sedang membuka pintu lain yang lebih besar. Saya akan terus mengetuk sampai pintu itu terbuka.", "Coba kembali satu hal yang pernah gagal Anda lakukan di masa lalu.", "I never give up", "When one door of sustenance closes, I am sure God is opening a bigger one. I will keep knocking until it opens.", "Try again one thing you failed to do in the past."],
  ["Saya menghargai setiap pemasukan", "Tidak ada jumlah yang terlalu kecil untuk disyukuri. Setiap rupiah yang masuk adalah bukti bahwa pintu rezeki saya selalu terbuka.", "Ucapkan terima kasih di dalam hati setiap kali Anda menerima uang sekecil apa pun.", "I value every income", "No amount is too small to be grateful for. Every rupiah that comes in is proof that my doors of sustenance are always open.", "Say thank you silently every time you receive money, no matter how small."],
  ["Saya menyelesaikan apa yang saya mulai", "Pekerjaan yang tuntas adalah kunci kepercayaan. Kepercayaan dari orang lain adalah mata uang yang akan mendatangkan rezeki berkali-lipat.", "Selesaikan satu tugas yang telah lama tertunda hari ini.", "I finish what I start", "A completed job is the key to trust. Trust from others is the currency that will bring multiple fortunes.", "Finish one long-overdue task today."],
  ["Keberuntungan berpihak pada yang bersiap", "Saya terus mengasah keterampilan dan pengetahuan saya. Ketika peluang besar itu datang, saya sudah siap untuk menangkapnya.", "Pelajari satu wawasan atau keahlian baru yang berhubungan dengan pekerjaan Anda.", "Luck favors the prepared", "I continuously sharpen my skills and knowledge. When a big opportunity arrives, I am ready to catch it.", "Learn one new insight or skill related to your work."],
  ["Saya membuang kebiasaan buruk", "Saya melepaskan kebiasaan menunda, malas, dan mengeluh. Ruang kosong yang ditinggalkannya akan diisi oleh produktivitas dan rezeki.", "Tahan diri Anda dari mengeluh selama 24 jam ke depan.", "I discard bad habits", "I let go of the habits of procrastinating, laziness, and complaining. The empty space left will be filled with productivity and fortune.", "Restrain yourself from complaining for the next 24 hours."],
  ["Saya adalah saluran berkah", "Saya diizinkan menjadi kaya agar saya bisa menjadi jembatan rezeki bagi orang-orang di sekitar saya. Kesuksesan saya membawa manfaat luas.", "Beli jualan teman atau berikan tip ekstra kepada orang yang melayani Anda.", "I am a channel of blessings", "I am allowed to be rich so I can be a bridge of fortune for the people around me. My success brings widespread benefits.", "Buy from a friend's business or give an extra tip to someone serving you."],
  ["Saya siap menerima kelimpahan tanpa batas", "Saya siap secara mental dan spiritual. 30 hari ini telah membentuk saya menjadi pribadi baru yang pantas menerima kejutan rezeki yang luar biasa besar.", "Buat komitmen tertulis untuk terus menjaga pikiran positif mulai hari ini dan seterusnya.", "I am ready to receive limitless abundance", "I am ready mentally and spiritually. These 30 days have shaped me into a new person who deserves extraordinarily large financial surprises.", "Make a written commitment to keep maintaining a positive mindset from today onwards."]
];

let selected = 0;
let done = new Set();
try { done = new Set(JSON.parse(localStorage.getItem("afirmasi30Done") || "[]")); } catch(e) {}
const $ = id => document.getElementById(id);
function save() { try { localStorage.setItem("afirmasi30Done", JSON.stringify([...done])); } catch(e) {} }

// Pengaturan Tema & Warna Status Bar Dinamis
function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  const isDark = theme === "dark";
  $("themeIcon").textContent = isDark ? "☀️" : "🌙";
  $("themeLabel").textContent = isDark ? "Light" : "Dark";
  
  const metaThemeColor = document.getElementById("metaThemeColor");
  if (metaThemeColor) {
    metaThemeColor.content = isDark ? "#000000" : "#f2f2f7";
  }

  try { localStorage.setItem("afirmasi30Theme", theme); } catch(e) {}
}
let currentTheme = "dark";
try { currentTheme = localStorage.getItem("afirmasi30Theme") || "dark"; } catch(e) {}
applyTheme(currentTheme);
$("themeBtn").addEventListener("click", () => {
  currentTheme = currentTheme === "dark" ? "light" : "dark";
  applyTheme(currentTheme);
});

// Pengaturan Font
const fontSelect = $("fontSelect");
let currentFont = "font-default";
try { currentFont = localStorage.getItem("afirmasi30Font") || "font-default"; } catch(e) {}
fontSelect.value = currentFont;
function applyFont() {
  $("affirmation").className = fontSelect.value;
  $("affirmationEn").className = "en-text " + fontSelect.value;
  try { localStorage.setItem("afirmasi30Font", fontSelect.value); } catch(e) {}
}
fontSelect.addEventListener("change", applyFont);
applyFont();

// Inisialisasi Tombol Hari berbentuk bulat
function initDays() {
  const daysContainer = $("days");
  affirmations.forEach((a,i) => {
    const b = document.createElement("button");
    b.id = "dayBtn-" + i;
    b.className = "day";
    b.textContent = i + 1;
    b.addEventListener("click", () => { selected=i; render(); });
    daysContainer.appendChild(b);
  });
}
initDays();

function render() {
  affirmations.forEach((a,i) => {
    const b = $("dayBtn-" + i);
    if(b) {
      b.className = "day" + (i===selected ? " active" : "") + (done.has(i) ? " done" : "");
    }
  });

  const activeDay = $("dayBtn-" + selected);
  if (activeDay) activeDay.scrollIntoView({behavior:"smooth", block:"nearest", inline:"center"});
  
  const a = affirmations[selected];
  $("dayLabel").textContent = "HARI " + String(selected+1).padStart(2,"0");
  
  $("title").textContent = a[0];
  $("affirmation").textContent = a[1];
  $("action").textContent = a[2];
  
  $("titleEn").textContent = a[3];
  $("affirmationEn").textContent = a[4];
  $("actionEn").textContent = a[5];
  
  $("progress").value = done.size;
  $("progressText").textContent = `${done.size} dari 30 selesai`;
  $("progressPercent").textContent = Math.round((done.size/30)*100) + "%";
  
  if (done.has(selected)) {
    $("markBtn").textContent = "Batalkan Selesai";
    $("markBtn").style.background = "var(--button)";
    $("markBtn").style.color = "var(--ink)";
  } else {
    $("markBtn").textContent = "Tandai Selesai";
    $("markBtn").style.background = "var(--accent)";
    $("markBtn").style.color = "#ffffff";
  }
  
  $("prevBtn").style.visibility = selected === 0 ? "hidden" : "visible";
  $("nextBtn").style.visibility = selected === 29 ? "hidden" : "visible";
}

$("markBtn").addEventListener("click", () => {
  if(done.has(selected)) {
    done.delete(selected);
  } else {
    done.add(selected);
    if (typeof confetti === 'function') {
      confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#34c759', '#30d158', '#ffffff'] });
    }
  }
  save(); render();
});

$("prevBtn").addEventListener("click", () => { if(selected>0) selected--; render(); });
$("nextBtn").addEventListener("click", () => { if(selected<29) selected++; render(); });

$("copyBtn").addEventListener("click", async () => {
  const a = affirmations[selected];
  const content = `Afirmasi Hari ${selected+1}:\n${a[0]} / ${a[3]}\n\n${a[1]}\n${a[4]}\n\nTindakan nyata: ${a[2]}`;
  try { await navigator.clipboard.writeText(content); $("copyBtn").textContent="Tersalin ✓"; setTimeout(()=>$("copyBtn").textContent="Salin Teks",1600); }
  catch(e) { window.prompt("Salin teks berikut:", content); }
});

$("printBtn").addEventListener("click", () => window.print());

render();

// Registrasi Service Worker PWA
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
